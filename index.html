<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>活动报名</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header h1 { font-size: 22px; color: #333; margin-bottom: 6px; }
  .header p { font-size: 13px; color: #999; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; font-weight: 500; }
  .field input {
    width: 100%; height: 48px; border: 1px solid #e0e0e0; border-radius: 10px;
    padding: 0 14px; font-size: 16px; color: #333;
    transition: border-color 0.2s; outline: none;
    -webkit-appearance: none;
  }
  .field input:focus { border-color: #667eea; }
  .field input::placeholder { color: #bbb; }
  .error { color: #e74c3c; font-size: 12px; margin-top: 4px; display: none; }
  .btn {
    width: 100%; height: 50px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: 600;
    cursor: pointer; margin-top: 8px; letter-spacing: 2px;
    transition: opacity 0.2s;
    -webkit-appearance: none;
  }
  .btn:active { opacity: 0.85; }
  .btn:disabled { opacity: 0.6; pointer-events: none; }

  .success { display: none; text-align: center; padding: 20px 0; }
  .success .icon { font-size: 56px; margin-bottom: 12px; }
  .success h2 { font-size: 20px; color: #333; margin-bottom: 8px; }
  .success p { font-size: 14px; color: #999; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #e74c3c; color: #fff; padding: 10px 24px; border-radius: 8px;
    font-size: 14px; display: none; z-index: 999;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>📋 活动报名</h1>
    <p>请填写以下信息完成报名</p>
  </div>

  <form id="regForm">
    <div class="field">
      <label>姓名</label>
      <input type="text" id="name" placeholder="请输入您的姓名" maxlength="30" autocomplete="name">
      <div class="error" id="nameError">请输入姓名</div>
    </div>
    <div class="field">
      <label>手机号</label>
      <input type="tel" id="phone" placeholder="请输入手机号码" maxlength="11" autocomplete="tel">
      <div class="error" id="phoneError">请输入有效的手机号码</div>
    </div>
    <div class="field">
      <label>公司名称</label>
      <input type="text" id="company" placeholder="请输入公司名称" maxlength="60" autocomplete="organization">
      <div class="error" id="companyError">请输入公司名称</div>
    </div>
    <button type="submit" class="btn" id="submitBtn">提 交 报 名</button>
  </form>

  <div class="success" id="successBox">
    <div class="icon">✅</div>
    <h2>报名成功</h2>
    <p>感谢您的报名，我们稍后会与您联系</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const form = document.getElementById('regForm');
const nameEl = document.getElementById('name');
const phoneEl = document.getElementById('phone');
const companyEl = document.getElementById('company');
const submitBtn = document.getElementById('submitBtn');
const toast = document.getElementById('toast');

function showError(id, show) {
  document.getElementById(id).style.display = show ? 'block' : 'none';
}

function showToast(msg) {
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2500);
}

function validate() {
  let valid = true;
  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();
  const company = companyEl.value.trim();

  if (!name) { showError('nameError', true); valid = false; }
  else { showError('nameError', false); }

  if (!phone || !/^1[3-9]\d{9}$/.test(phone)) { showError('phoneError', true); valid = false; }
  else { showError('phoneError', false); }

  if (!company) { showError('companyError', true); valid = false; }
  else { showError('companyError', false); }

  return valid;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!validate()) return;

  submitBtn.disabled = true;
  submitBtn.textContent = '提交中...';

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: nameEl.value.trim(),
        phone: phoneEl.value.trim(),
        company: companyEl.value.trim()
      })
    });
    if (res.ok) {
      form.style.display = 'none';
      document.getElementById('successBox').style.display = 'block';
    } else {
      const data = await res.json();
      showToast(data.message || '提交失败，请重试');
    }
  } catch {
    showToast('网络错误，请重试');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '提 交 报 名';
  }
});

[nameEl, phoneEl, companyEl].forEach(el => {
  el.addEventListener('input', () => validate());
});
</script>
</body>
</html>
